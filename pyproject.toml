[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
version = "4.0.17"
name = "pyveb"
authors = ["pieter <pieter.de.petter@veb.be>", "wout <wout.spaas@veb.be>"]
description = "Package containing common code and reusable components for pipelines and dags"
readme = "readme.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
requests = "2.34.2"
selenium = "4.51.0"
webdriver-manager = "4.1.2"
boto3 = "1.43.106"
botocore = "1.43.106"
pyyaml = "6.0.3"
simple-ddl-parser = "1.13.0"
pyspark = "4.2.0"
psycopg2-binary = "2.9.13"
psutil = "7.2.2"
pandas = "2.3.3"
numpy = "2.5.4"
s3fs="2026.9.0"
pyarrow = "23.0.1"
pyodbc = "5.3.0"
xlrd = "2.0.2"
Office365-REST-Python-Client = "2.6.2"
xlsxwriter = "3.2.9"
pyjwt = "2.15.1"
aiohttp = "3.14.5"
cryptography = "50.0.2"

[tool.poetry.urls]
"Homepage" = "https://vlaamsenergiebedrijf.visualstudio.com/Terra/_git/terra-etl?path=/common_code"
